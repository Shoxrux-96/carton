server {
    server_name shovotcarton.uz www.shovotcarton.uz;

    root /opt/carton/artifacts/ishlab-chiqarish/dist/public;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # APK yuklab olish
    location ^~ /apk/ {
        alias /opt/carton/apk/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Expo web (mobil ilova brauzerda) — /m/
    location ^~ /_expo/ {
        alias /opt/carton/artifacts/mobile/dist-web/_expo/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /m { return 301 /m/; }

    location /m/ {
        alias /opt/carton/artifacts/mobile/dist-web/;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shovotcarton.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shovotcarton.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.shovotcarton.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = shovotcarton.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name shovotcarton.uz www.shovotcarton.uz;
    return 404; # managed by Certbot




}